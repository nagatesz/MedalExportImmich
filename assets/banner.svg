<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <rect width="900" height="200" rx="16" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
  </g>

  <!-- Left glow accent -->
  <circle cx="80" cy="100" r="120" fill="#f97316" opacity="0.04"/>

  <!-- Logo box -->
  <rect x="32" y="68" width="64" height="64" rx="16" fill="url(#logoGrad)" filter="url(#glow)"/>
  <text x="64" y="109" text-anchor="middle" font-size="32" fill="white">⚡</text>

  <!-- Title -->
  <text x="116" y="98" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">Medal Export</text>
  <text x="116" y="130" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f97316" filter="url(#glow)" letter-spacing="-0.5">to Immich</text>

  <!-- Tagline -->
  <text x="116" y="155" font-family="'Inter', -apple-system, sans-serif" font-size="13" fill="#7d8590">Lossless · Per-file streaming · Zero skipped files · Live dashboard</text>

  <!-- Progress bar demo -->
  <rect x="460" y="78" width="400" height="10" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <rect x="460" y="78" width="300" height="10" rx="5" fill="url(#barGrad)" opacity="0.9"/>

  <!-- Stats beside bar -->
  <text x="460" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#7d8590" letter-spacing="0.08em">TOTAL PROGRESS</text>

  <text x="765" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="end">75%</text>

  <!-- Stat chips -->
  <g transform="translate(460, 104)">
    <!-- Speed -->
    <rect width="88" height="52" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="44" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="0.08em">SPEED</text>
    <text x="44" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#3fb950">62.4</text>
    <text x="44" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#484f58">MB/s</text>

    <!-- Files -->
    <rect x="96" width="88" height="52" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="140" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="0.08em">UPLOADED</text>
    <text x="140" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#58a6ff">1,154</text>
    <text x="140" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#484f58">files</text>

    <!-- ETA -->
    <rect x="192" width="88" height="52" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="236" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="0.08em">ETA</text>
    <text x="236" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#a855f7">12m 4s</text>
    <text x="236" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#484f58">remaining</text>

    <!-- Data -->
    <rect x="288" width="104" height="52" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="340" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#7d8590" letter-spacing="0.08em">DATA</text>
    <text x="340" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#f97316">67.2 GB</text>
    <text x="340" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#484f58">of 89.6 GB</text>
  </g>
</svg>
